<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRI BloomFlow | Admin Gateway</title>
    
    <!-- CSS Links -->
    <link rel="stylesheet" href="register.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <style>
        /* Toast notification styling for admin gateway */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        .toast {
            background: white;
            color: #2d3748;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(181, 109, 127, 0.2);
            border-left: 4px solid #4a5568;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14.5px;
            font-weight: 500;
            transform: translateY(-20px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast i {
            color: #4a5568;
            font-size: 18px;
        }
        .toast.error {
            border-left-color: #e53e3e;
        }
        .toast.error i {
            color: #e53e3e;
        }
        
        .admin-btn {
            background: linear-gradient(135deg, #718096 0%, #4a5568 100%) !important;
            box-shadow: 0 8px 25px rgba(74, 85, 104, 0.3) !important;
        }
        
        .admin-btn:hover {
            box-shadow: 0 12px 30px rgba(74, 85, 104, 0.45) !important;
        }
    </style>
</head>
<body>

    <!-- Floating Background Flowers -->
    <div class="bg-flower flower-1">
        <img src="images/rose.png" alt="Flower Ornament">
    </div>
    <div class="bg-flower flower-2">
        <img src="images/bouquet.png" alt="Flower Ornament">
    </div>
    <div class="bg-flower flower-3">
        <img src="images/sunflower.png" alt="Flower Ornament">
    </div>
    <div class="bg-flower flower-4">
        <img src="images/lily.png" alt="Flower Ornament">
    </div>

    <!-- Main Card Container -->
    <div class="container">
        
        <!-- Left Side: Login form -->
        <div class="left">
            <!-- Unique Professional SRI BloomFlow Logo Emblem -->
            <a href="home.html" class="sri-brand-logo" aria-label="SRI BloomFlow Home">
                <svg class="sri-logo-emblem" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="sriRoseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff758c" />
                            <stop offset="50%" stop-color="#b56d7f" />
                            <stop offset="100%" stop-color="#7e3b56" />
                        </linearGradient>
                        <linearGradient id="sriGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffe699" />
                            <stop offset="50%" stop-color="#f5a623" />
                            <stop offset="100%" stop-color="#c97a2b" />
                        </linearGradient>
                        <filter id="glowEmblem" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#b56d7f" flood-opacity="0.3"/>
                        </filter>
                    </defs>
                    <circle cx="22" cy="22" r="20" fill="#fff5f8" stroke="url(#sriRoseGrad)" stroke-width="1.5" opacity="0.95" />
                    <circle cx="22" cy="22" r="17.5" fill="none" stroke="url(#sriGoldGrad)" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.7" />
                    <path d="M22 5 C25 13, 31 16, 39 22 C31 28, 25 31, 22 39 C19 31, 13 28, 5 22 C13 16, 19 13, 22 5 Z" fill="url(#sriRoseGrad)" filter="url(#glowEmblem)" />
                    <path d="M22 9 C26 15, 29 18, 35 22 C29 26, 26 29, 22 35 C18 29, 15 26, 9 22 C15 18, 18 15, 22 9 Z" fill="#ffffff" opacity="0.38" />
                    <path d="M10 10 C16 15, 18 20, 22 22 C20 18, 15 16, 10 10 Z" fill="url(#sriGoldGrad)" opacity="0.8" />
                    <path d="M34 10 C28 15, 26 20, 22 22 C24 18, 29 16, 34 10 Z" fill="url(#sriGoldGrad)" opacity="0.8" />
                    <path d="M34 34 C28 29, 26 24, 22 22 C24 26, 29 28, 34 34 Z" fill="url(#sriGoldGrad)" opacity="0.8" />
                    <path d="M10 34 C16 29, 18 24, 22 22 C20 26, 15 28, 10 34 Z" fill="url(#sriGoldGrad)" opacity="0.8" />
                    <circle cx="22" cy="22" r="4.5" fill="url(#sriGoldGrad)" />
                    <circle cx="22" cy="22" r="2" fill="#ffffff" />
                </svg>
                <div class="sri-logo-text">
                    <span class="sri-logo-prefix">SRI</span>
                    <span class="sri-logo-main">Bloom<span class="sri-logo-accent">Flow</span></span>
                </div>
            </a>

             <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
                
                <div class="form-group">
                    <label for="admin-email">Admin Username</label>
                    <div class="input-group">
                        <input type="email" id="admin-email" placeholder=" " required>
                        <i class="fa-regular fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="admin-password">Console Password</label>
                    <div class="input-group">
                        <input type="password" id="admin-password" placeholder=" " required>
                        <i class="fa-solid fa-lock input-icon"></i>
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('admin-password', this)"></i>
                    </div>
                </div>

                <button type="submit" class="register-btn admin-btn">Login to Console</button>

                <p class="signup">
                    Not an administrator?
                    <a href="login.html" style="color: #4a5568;">Customer Login</a>
                </p>

            </form>
        </div>

        <!-- Right Side: Decorative Image & Branding -->
        <div class="right" style="background: rgba(74, 85, 104, 0.08);">
            <div class="visual-content">
                <img src="login_flower_new.png" alt="Premium Bouquet Preview">
                <h3 style="color: #4a5568;">Security. Integrity. Overview.</h3>
                <p>"Manage flower listings, monitor e-commerce orders, and consult on event bookings."</p>
            </div>
        </div>

    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <script>
        // Password toggler
        function togglePasswordVisibility(fieldId, icon) {
            const field = document.getElementById(fieldId);
            if (field.type === "password") {
                field.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                field.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        // Elegant Toast notification function
        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-xmark' : 'fa-circle-check'}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.remove();
                }, 350);
            }, 3000);
        }

        // Login Handler (MongoDB Backend + Fallback)
        async function handleAdminLogin(e) {
            e.preventDefault();

            const email = document.getElementById('admin-email').value.trim().toLowerCase();
            const password = document.getElementById('admin-password').value;

            // 1. Try Backend & MongoDB Admin Login
            if (window.BloomAPI && window.BloomAPI.auth) {
                try {
                    const res = await window.BloomAPI.auth.adminLogin({ email, password });
                    if (res.ok && res.data && res.data.success) {
                        localStorage.setItem('bloomflow_active_user', JSON.stringify({
                            name: "Administrator Console",
                            email: "admin@bloomflow.com",
                            isAdmin: true
                        }));
                        showToast("Console access granted! Redirecting...", false);
                        setTimeout(() => {
                            window.location.href = "admin-dashboard.html";
                        }, 1000);
                        return;
                    } else if (res.status === 401 || (res.data && !res.data.success)) {
                        showToast(res.data.message || "Access Denied! Incorrect username or password.", true);
                        return;
                    }
                } catch (apiErr) {
                    console.warn("Admin backend login connection fallback:", apiErr);
                }
            }

            // 2. Admin fallback check
            if (email === 'admin@bloomflow.com' && password === 'admin123') {
                localStorage.setItem('bloomflow_active_user', JSON.stringify({
                    name: "Administrator Console",
                    email: "admin@bloomflow.com",
                    isAdmin: true
                }));

                showToast("Console access granted! Redirecting...", false);

                setTimeout(() => {
                    window.location.href = "admin-dashboard.html";
                }, 1000);
            } else {
                showToast("Access Denied! Incorrect username or password.", true);
            }
        }
    </script>
    <!-- Bootstrap 5 JS Bundle & API Bridge -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
</body>
</html>
